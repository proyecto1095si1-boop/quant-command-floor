name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.19.0, 22.13.0, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run coverage
      - run: node --check server/index.js && node --check dist/app.js
      - name: Production fail-closed smoke test
        env:
          NODE_ENV: production
          AUTH_SECRET: 0123456789abcdef0123456789abcdef
          MARKET_DATA_ENABLED: "false"
        run: |
          node -e "const {SecurityManager}=require('./server/security/manager'); const s=new SecurityManager(); if(!s.status().enforced) process.exit(1)"
